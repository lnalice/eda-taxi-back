spring.application.name=user-service
server.port=${SERVER_PORT:8082}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# topic
spring.kafka.topic.name.call=${TOPIC_CALL:Call}
spring.kafka.topic.name.callResponse=${TOPIC_CALL_RESPONSE:CallResponse}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.listener.missing-topics-fatal=false

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=10
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5

spring.kafka.consumer.group-id=${USER_SERVICE_CONSUMER_GROUP:user-service}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.key.delegate.class=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.listener.ack-mode=record

app.kafka.retry.max-attempts=${KAFKA_RETRY_MAX_ATTEMPTS:3}
app.kafka.retry.initial-interval-ms=${KAFKA_RETRY_INITIAL_INTERVAL_MS:1000}
app.kafka.retry.multiplier=${KAFKA_RETRY_MULTIPLIER:2.0}
app.kafka.retry.max-interval-ms=${KAFKA_RETRY_MAX_INTERVAL_MS:10000}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
